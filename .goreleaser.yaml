version: 2

builds:
  - id: sshv
    main: ./cmd/sshv
    binary: sshv
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

brews:
  - name: sshv
    repository:
      owner: rfahmi
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/rfahmi/sshv"
    description: "Lightweight TUI SSH vault for macOS with Keychain auto-login"
    license: "MIT"
    test: |
      assert_match version.to_s, shell_output("#{bin}/sshv --version")
